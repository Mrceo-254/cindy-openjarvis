
# Cindy - OpenJarvis Render Deployment
services:
  - type: web
    name: cindy-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .

    dockerCommand: serve --host 0.0.0.0 --port 10000 --engine cloud --model gemini-3.5-flash-lite

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PORT
        value: "10000"

      - key: OPENJARVIS_API_KEY
        generateValue: true

      - key: GEMINI_API_KEY
        sync: false

      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis

